<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <Title>PicPes - Registro Fotográfico</Title>
    <link rel="icon" type="image/svg+xml" href="assets/icon-blockquote.svg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<header>
    <h1>Registro de Vistoria</h1>
    <p>Localização, rodovia e medidas em campo</p>
</header>

<div class="card">
    <h2>Localização</h2>
    <div class="loc-row">
        <div class="loc-field">
            <label for="latitude">Latitude</label>
            <input type="text" id="latitude" readonly placeholder="—">
        </div>
        <div class="loc-field">
            <label for="longitude">Longitude</label>
            <input type="text" id="longitude" readonly placeholder="—">
        </div>
    </div>
    <button class="capture-btn" id="capturarBtn" type="button">Capturar localização</button>
    <div class="status" id="locStatus"></div>
</div>

<div class="card">
    <h2>Rodovia</h2>
    <div class="br-km-row">
        <div class="br-field">
            <label for="br">Via</label>
            <input type="text" id="br" placeholder="Ex: BR-040">
        </div>
        <div class="km-field">
            <label for="km">Quilometragem</label>
            <input type="number" id="km" placeholder="Ex: 123.4" step="0.1">
        </div>
    </div>
</div>

<div class="card">
    <h2>Objeto</h2>
    <div>
        <input class="objeto" type="text" id="objeto-medido" placeholder="o que está sendo medido?">
    </div>
</div>

<div class="card">
    <h2>Alturas medidas</h2>
    <div class="alturas-grid">
        <div>
            <label for="altura1">Lado Esquerdo</label>
            <input type="number" id="altura1" placeholder="m" step="0.01">
        </div>
        <div>
            <label for="altura2">Faixa Central</label>
            <input type="number" id="altura2" placeholder="m" step="0.01">
        </div>
        <div>
            <label for="altura3">Lado Direito</label> <!-- CORRIGIDO: estava "Lado Esquerdo" -->
            <input type="number" id="altura3" placeholder="m" step="0.01">
        </div>
    </div>

    <div class="altura-extra">
        <label for="alturaAdicional">Alturas adicionais</label>
        <!-- ADICIONADO: ID -->
        <textarea id="alturaAdicional" rows="4" cols="50" placeholder="informações adicionais"></textarea>
    </div>
</div>

<div class="card">
    <h2>Larguras medidas</h2>
    <div class="larguras-grid">
        <div>
            <label for="largura1">Largura total</label>
            <input type="number" id="largura1" placeholder="m" step="0.01">
        </div>
        <div>
            <label for="largura2">Passeio esquerdo</label>
            <input type="number" id="largura2" placeholder="m" step="0.01">
        </div>
        <div>
            <label for="largura3">Passeio direito</label>
            <input type="number" id="largura3" placeholder="m" step="0.01">
        </div>
    </div>
    <div class="largura-extra">
        <label for="larguraAdicional">Larguras adicionais</label>
        <!-- ADICIONADO: ID -->
        <textarea id="larguraAdicional" rows="4" cols="50" placeholder="informações adicionais"></textarea>
    </div>
</div>

<button class="save-btn" id="salvarBtn" type="button">Salvar registro</button>

<script src="js/script.js"></script>
</body>
</html>
